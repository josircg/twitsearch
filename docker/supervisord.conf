[unix_http_server]
file=/var/run/supervisor.sock
; permite que o usuário webapp (gunicorn) rode supervisorctl, como exigido pelo deploy
chmod=0770
chown=webapp:webapp

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:twitsearch]
command=/opt/venv/bin/gunicorn twitsearch.wsgi -t120 -b 127.0.0.1:8000 -w1 --pythonpath=/app --error-logfile=-
directory=/app
user=webapp
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; PROJECT_DIR e PYTHON_PATH são passados pelo Django; aqui só o serviço a reiniciar
environment=SUPERVISOR_SERVICE="twitsearch"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
